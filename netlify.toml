# Ballet Pose Matcher: Netlify config. Owner: Harbor (netlify-deployer).
# A static site: no build step, no functions, no API keys. Netlify only serves files;
# the browser does all the computer vision (OpenCV.js / WebAssembly) and storage (IndexedDB).

[build]
  publish = "."

# Sensible security headers for every file.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# If you self-host OpenCV.js (vendor/opencv/), serve any .wasm with the right MIME type
# (WebAssembly.instantiateStreaming rejects anything else) and cache it for a year.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sample photos rarely change.
[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The service worker must never be cached, or users get stuck on an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
