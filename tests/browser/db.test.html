<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IndexedDB tests · Salsa Shape Matcher</title></head>
<body>
<h1>IndexedDB tests</h1>
<p>Open with <code>?phase=write</code>, then (after a browser restart or reload) <code>?phase=read</code>, then <code>?phase=reset</code>.
Results are written below and to <code>document.title</code>.</p>
<pre id="log"></pre>
<script src="../../js/db.js"></script>
<script>
(async () => {
  const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
  const phase = new URLSearchParams(location.search).get('phase') || 'write';
  let pass = 0, fail = 0;
  const check = (name, ok) => { ok ? pass++ : fail++; log(`${ok ? 'PASS' : 'FAIL'} ${name}`); };

  async function tinyJpeg(color) {
    const c = document.createElement('canvas'); c.width = 120; c.height = 90;
    const g = c.getContext('2d'); g.fillStyle = color; g.fillRect(0, 0, 120, 90);
    g.fillStyle = '#222'; g.beginPath(); g.arc(60, 30, 10, 0, 7); g.fill(); g.fillRect(55, 40, 10, 40);
    return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.8));
  }

  try {
    if (phase === 'write') {
      await DB.resetAll();
      const blob = await tinyJpeg('#f3d6dc');
      const points = new Int32Array([10, 10, 100, 10, 100, 80, 10, 80]);
      await DB.saveReference({ id: 'ref-dip', name: 'Dip', createdAt: Date.now() - 2000, points, aspect: 0.8, solidity: 0.4, imageBlob: blob, thumbBlob: blob });
      await DB.saveReference({ id: 'ref-styling', name: 'Shine styling', createdAt: Date.now() - 1000, points, aspect: 2.4, solidity: 0.3, imageBlob: blob, thumbBlob: blob });
      for (const [i, score] of [61, 72, 84].entries()) {
        await DB.saveAttempt({ id: 'att-' + i, createdAt: Date.now() + i, refId: 'ref-dip', refName: 'Dip', score,
          parts: { shape: score, proportions: 80, openness: 90 }, metrics: { aspect: 0.8 }, ms: 180, originalBlob: blob, resultBlob: blob, thumbBlob: blob });
      }
      await DB.saveSettings({ cleanup: 4, threshold: null, thresholdValue: 120, grabcut: false, ghost: true, autosave: true, refId: 'ref-dip' });
      const refs = await DB.listReferences();
      check('two references saved', refs.length === 2);
      check('newest reference first', refs[0].id === 'ref-styling');
      check('Int32Array survives structured clone', refs[0].points instanceof Int32Array && refs[0].points[2] === 100);
      check('three attempts saved', (await DB.listAttempts()).length === 3);
      check('index byRef finds attempts', (await DB.attemptsFor('ref-dip')).length === 3);
      const got = await DB.getAttempt('att-2');
      check('Blob stored and read back', got.thumbBlob instanceof Blob && got.thumbBlob.size > 100);
      const bmp = await createImageBitmap(got.thumbBlob);
      check('stored Blob is a decodable image', bmp.width === 120 && bmp.height === 90);
      await DB.deleteAttempt('att-0');
      check('delete removes one attempt', (await DB.listAttempts()).length === 2);
      await DB.saveAttempt({ ...got, id: 'att-0', score: 61 });
      const est = await DB.estimate();
      check('storage estimate available', !!est && est.usage >= 0);
    } else if (phase === 'read') {
      const refs = await DB.listReferences();
      check('references persisted after restart', refs.length === 2);
      check('attempts persisted after restart', (await DB.listAttempts()).length === 3);
      const s = await DB.getSettings();
      check('settings persisted after restart', s && s.cleanup === 4 && s.refId === 'ref-dip');
    } else if (phase === 'reset') {
      await DB.resetAll();
      check('database deleted', (await indexedDB.databases()).every((d) => d.name !== DB.DB_NAME));
      check('fresh database is empty', (await DB.listReferences()).length === 0);
      await DB.resetAll();
    }
  } catch (e) { fail++; log('ERROR ' + (e && e.stack || e)); }
  log(`\n${phase}: ${pass} passed, ${fail} failed`);
  document.title = `${fail ? 'FAIL' : 'PASS'} ${phase} ${pass}/${pass + fail}`;
})();
</script>
</body>
</html>
